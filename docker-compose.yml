services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memecoin_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5423:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scanner} -d ${POSTGRES_DB:-memecoin_scanner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  fastapi-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://scanner:change-me@postgres:5432/memecoin_scanner}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CRITERIA_PATH: /app/config/criteria.yaml
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  streamlit-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      BACKEND_URL: http://fastapi-backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - fastapi-backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
